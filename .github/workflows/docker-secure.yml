name: Test and Publish ChainLink Server (Hardened)

on:
  push:
    branches: [main]
    # GitHub tag filters are globs; the publish job enforces exact SemVer below.
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      - name: Run tests
        run: python -m pytest -v

  build:
    name: Validate Production Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false

  publish:
    name: Build and Publish Docker Image
    needs: [test, build]
    # Push filters restrict this to main and release-tag candidates; the
    # Select image tag step rejects any invalid candidate before publication.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Serialize the existence check and push for each tag, including reruns.
    concurrency:
      group: chainlink-image-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select image tag
        id: image
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
            echo 'tag=dev' >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo '::error::Release tags must match vMAJOR.MINOR.PATCH (no leading zeros).'
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image for publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          load: true
          push: false
          tags: ghcr.io/tannman129/chainlink-server:${{ steps.image.outputs.tag }}

      - name: Skip stale development publication
        id: freshness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
            main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [[ ! "$main_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo '::error::Could not verify the current main commit.'
              exit 1
            fi
            if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
              echo 'Skipping stale development build; main has advanced.'
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"

      - name: Refuse an existing or unverifiable release tag
        if: github.ref_type == 'tag'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.image.outputs.tag }}
        run: python3 .github/scripts/check_release_tag.py

      - name: Log in to GitHub Container Registry
        if: steps.freshness.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push validated image
        if: steps.freshness.outputs.publish == 'true'
        env:
          IMAGE: ghcr.io/tannman129/chainlink-server:${{ steps.image.outputs.tag }}
        run: docker push "$IMAGE"
